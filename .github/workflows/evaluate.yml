name: RAG Evaluation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Debug - Print Installed Versions
      run: |
        pip show langchain langchain-core langchain-community langchain-openai langchain-chroma langchain-cohere ragas | grep -E "^(Name|Version)"
        python -c "
from ragas.metrics._faithfulness import faithfulness
from ragas.metrics._answer_relevance import answer_relevancy
from ragas.metrics.base import Metric
print('faithfulness type:', type(faithfulness), 'is Metric:', isinstance(faithfulness, Metric))
print('answer_relevancy type:', type(answer_relevancy), 'is Metric:', isinstance(answer_relevancy, Metric))
"

    - name: Run Data Ingestion
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python src/ingest.py

    - name: Execute RAG Evaluation Pipeline
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      run: |
        python src/evaluate.py